<style>

.cake-scene{max-width:650px}.cake{width:280px;height:198px;position:relative;margin:0 auto 2px;filter:drop-shadow(4px 4px 0 #33263e22)}.plate{position:absolute;left:20px;bottom:8px;width:240px;height:18px;border:3px solid var(--ink);background:#bdabed;border-radius:50%}.sponge{position:absolute;left:33px;bottom:22px;width:214px;height:78px;background:#ffb5cf;border:3px solid var(--ink);border-radius:0 0 17px 17px}.sponge::after{content:'♡      ♡      ♡';position:absolute;left:24px;top:22px;font-size:25px;white-space:nowrap;color:#e34c8c}.frost{position:absolute;left:32px;bottom:84px;width:216px;height:26px;background:#fff0d4;border:3px solid var(--ink);border-radius:18px;z-index:2}.candle{position:absolute;bottom:108px;width:15px;height:45px;background:repeating-linear-gradient(0deg,#b7efd6 0 10px,#fff 10px 17px);border:2px solid var(--ink);border-radius:3px;z-index:3}.candle.c0{left:94px}.candle.c1{left:134px}.candle.c2{left:174px}.flame{position:absolute;width:19px;height:26px;bottom:153px;border-radius:55% 55% 54% 5%;transform:rotate(-45deg);background:linear-gradient(135deg,#ffe94c,#ff8a3a);border:2px solid #80455e;z-index:4;animation:flicker .8s ease-in-out infinite;transform-origin:bottom center;transition:opacity .3s,scale .3s}.flame.f0{left:91px}.flame.f1{left:131px;animation-delay:-.33s}.flame.f2{left:171px;animation-delay:-.5s}.flame.gone{opacity:0;scale:.2}.flame.bending{transform:rotate(-77deg) skewY(18deg)}.smoke{position:absolute;bottom:165px;left:135px;font-size:20px;opacity:0}.smoke.show{animation:smoke 1.4s forwards}

  "apology":{"tag":"sebentar, sebelum yang lain","title":"Aku mau minta maaf.","paragraphs":["Aku tahu kemarin aku udah bikin kamu kesel. Aku beneran minta maaf, ya.","Aku nggak pengin perasaan kamu dianggap sepele. Aku juga nggak berharap semuanya langsung baik-baik aja cuma gara-gara ada kejutan ini.","Aku mau belajar lebih peka dan lebih dengerin kamu. Aku sayang kamu, dan aku mau nunjukinnya lewat sikap juga."],"button":"boleh lanjut, sayang?"},

  "question":{"tag":"boleh aku tanya sesuatu?","title":"Jangan ngambek-ngambek lagi ya?","subtitle":"Coba jawab, tapi hati-hati ada yang jahil.","yes":"iyaa ♡","no":"nggak 🙄","teases":["eh, mau ke mana? 👀","tombolnya ternyata pemalu wkwk","udah pencet iya aja sayang wkwk 💗"]},

 async function submit(){if(reading)return;reading=true;message.textContent='sebentar... ♡';try{const gift=await openGift(seq.join(''));if(scene!==7)return;const url=String(gift.url||'').trim();const valid=/^https:\/\//i.test(url)&&new URL(url).hostname!=='';stage.innerHTML=`<section class="scene unlock-success">${iconDecor()}<p class="eyebrow">${fmt(COPY.claim.ready)}</p><div class="claim-ticket"><div class="ribbon">🎁</div><h2>${fmt(gift.title||'Hadiah kecil buat kamu')}</h2>${gift.amount?`<p class="claim-amount">${fmt(gift.amount)}</p>`:''}<p>${fmt(gift.note||'Ini khusus buat kamu, ya ♡')}</p>${valid?`<a class="btn pink claim-button" id="claimLink" href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer">${fmt(COPY.claim.button)}</a>`:`<p class="claim-error">${fmt(COPY.claim.empty)}</p>`}<p class="small" style="margin:19px 0 0">${fmt(COPY.claim.linkHint)}</p></div><p class="small">${fmt(COPY.claim.endLine)}</p></section>`}catch(err){message.textContent=err?.message==='not-configured'?'hadiahnya belum disiapkan oleh pengirim ♡':COPY.claim.wrong;nodes.forEach(n=>n.classList.add('error'));setTimeout(()=>{if(scene===7&&board.isConnected){clear();reading=false}},700);return}reading=false}
}
function creator(){stage.innerHTML=`<section class="scene editor"><p class="eyebrow">private creator mode ✏️</p><h2>Personalisasi suratmu.</h2><p class="sub">Semua copy, hadiah, dan tautan klaim bisa diisi di sini. Hasilnya tetap satu file HTML.</p><form id="editForm" class="editor-grid"></form><button class="btn pink" id="save" type="button">simpan HTML untuk dikirim ♡</button><p class="editor-msg" id="editMsg"></p><p class="editor-help">Pola kunci untukmu: isi urutan 5 digit yang kamu pilih (jangan pernah tulis polanya di teks hadiah). Link klaim sebaiknya link resmi dengan sistem sekali klaim. Jangan gunakan URL yang mengandung data rekening atau password pribadi.</p></section>`;const form=$('#editForm');const section={intro:'Pembuka',apology:'Minta maaf',envelope:'Amplop',question:'Pertanyaan jahil',notes:'Catatan kecil',cake:'Tiup lilin',letter:'Surat',claim:'Kunci & hadiah'};const make=(path,v)=>{const field=document.createElement('label');const pathString=path.join('.');field.textContent=pathString.replace(/^\w+\./,'').replace(/([A-Z])/g,' $1');let el;if(typeof v==='string'&&v.length>100){el=document.createElement('textarea');el.rows=3;el.value=v}else{el=document.createElement('input');el.value=v}el.dataset.path=JSON.stringify(path);field.appendChild(el);return field};const group=(title,entries)=>{const fs=document.createElement('fieldset'),legend=document.createElement('legend');legend.textContent=title;fs.append(legend);entries.forEach(([path,v])=>fs.append(make(path,v)));form.append(fs)};group('Nama',[['name',COPY.name],['sender',COPY.sender]].map(([k,v])=>[[k],v]));for(const [key,title] of Object.entries(section)){const entries=[];function walk(data,path){if(typeof data==='string'){entries.push([path,data]);return}if(Array.isArray(data)){data.forEach((it,i)=>walk(it,[...path,i]));return}if(data&&typeof data==='object'){Object.keys(data).forEach(k=>walk(data[k],[...path,k]))}}walk(COPY[key],[key]);group(title,entries)}group('Hadiah uang & kunci',[ [['gift','title'],'Buat jajan kesukaanmu ♡'],[['gift','amount'],'Rp —'],[['gift','note'],'Selamat ulang tahun, sayang. Ini buat kamu ♡'],[['gift','url'],''],[['gift','pattern'],''] ]);const fields=[...form.querySelectorAll('[data-path]')];const linkField=fields.find(el=>JSON.parse(el.dataset.path).join('.')==='gift.url');linkField.placeholder='https://link-klaim-dari-layanan-kirim-uang';const patternField=fields.find(el=>JSON.parse(el.dataset.path).join('.')==='gift.pattern');patternField.placeholder='masukkan pola rahasia';patternField.maxLength=9;$('#save').onclick=async()=>{const msg=$('#editMsg'),btn=$('#save');msg.textContent='';const modified=structuredClone(COPY),gift={};fields.forEach(field=>{const path=JSON.parse(field.dataset.path),value=field.value;if(path[0]==='gift'){gift[path[1]]=value;return}let target=modified;for(let i=0;i<path.length-1;i++)target=target[path[i]];target[path[path.length-1]]=value});if(!/^\d{5,9}$/.test(gift.pattern)){msg.textContent='Pola harus terdiri dari 5–9 angka.';return}if(!/^https:\/\//i.test(gift.url.trim())){msg.textContent='Isi URL klaim yang benar dan diawali https://';return}try{new URL(gift.url)}catch{msg.textContent='URL klaim belum valid.';return}if(!crypto?.subtle){msg.textContent='Browser ini tidak mendukung Web Crypto. Coba Chrome/Safari terbaru.';return}btn.disabled=true;btn.textContent='sedang menyiapkan surat...';try{const encrypted=await lockGift(gift.pattern,{url:gift.url,title:gift.title,amount:gift.amount,note:gift.note});const source='<!doctype html>\n'+document.documentElement.outerHTML;const updated=source.replace(/\/\* EDITABLE_START \*\/[\s\S]*?\/\* EDITABLE_END \*\//,`/* EDITABLE_START */${JSON.stringify(modified,null,2).replaceAll('<','\\u003c')}/* EDITABLE_END */`).replace(/\/\* ENCRYPTED_START \*\/[\s\S]*?\/\* ENCRYPTED_END \*\//,`/* ENCRYPTED_START */${JSON.stringify(encrypted)}/* ENCRYPTED_END */`);const blob=new Blob([updated],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='untuk-kamu-happy-birthday.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),6000);msg.textContent='Berhasil! File HTML personal sudah dibuat. Tes dulu sebelum dikirim, ya.'}catch(err){msg.textContent='Gagal membuat file. Coba buka lewat browser lain.'}finally{btn.disabled=false;btn.textContent='simpan HTML untuk dikirim ♡'}}}
const query=new URLSearchParams(location.search);if(query.get('edit')==='1')creator();else show(0);
