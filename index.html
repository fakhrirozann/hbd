<style>

.cake-scene{max-width:650px}.cake{width:280px;height:198px;position:relative;margin:0 auto 2px;filter:drop-shadow(4px 4px 0 #33263e22)}.plate{position:absolute;left:20px;bottom:8px;width:240px;height:18px;border:3px solid var(--ink);background:#bdabed;border-radius:50%}.sponge{position:absolute;left:33px;bottom:22px;width:214px;height:78px;background:#ffb5cf;border:3px solid var(--ink);border-radius:0 0 17px 17px}.sponge::after{content:'♡      ♡      ♡';position:absolute;left:24px;top:22px;font-size:25px;white-space:nowrap;color:#e34c8c}.frost{position:absolute;left:32px;bottom:84px;width:216px;height:26px;background:#fff0d4;border:3px solid var(--ink);border-radius:18px;z-index:2}.candle{position:absolute;bottom:108px;width:15px;height:45px;background:repeating-linear-gradient(0deg,#b7efd6 0 10px,#fff 10px 17px);border:2px solid var(--ink);border-radius:3px;z-index:3}.candle.c0{left:94px}.candle.c1{left:134px}.candle.c2{left:174px}.flame{position:absolute;width:19px;height:26px;bottom:153px;border-radius:55% 55% 54% 5%;transform:rotate(-45deg);background:linear-gradient(135deg,#ffe94c,#ff8a3a);border:2px solid #80455e;z-index:4;animation:flicker .8s ease-in-out infinite;transform-origin:bottom center;transition:opacity .3s,scale .3s}.flame.f0{left:91px}.flame.f1{left:131px;animation-delay:-.33s}.flame.f2{left:171px;animation-delay:-.5s}.flame.gone{opacity:0;scale:.2}.flame.bending{transform:rotate(-77deg) skewY(18deg)}.smoke{position:absolute;bottom:165px;left:135px;font-size:20px;opacity:0}.smoke.show{animation:smoke 1.4s forwards}

.hug-popup-kicker{margin:0;color:#775b8a;font:900 11px 'Courier New',monospace;letter-spacing:.09em;text-transform:uppercase}

.hug-popup-art .b.right{animation-delay:-.4s}.hug-popup-art .lov{animation:floatup 1.7s ease-out infinite;transform-origin:center}.hug-popup-art .lov.two{animation-delay:-.75s}
.hug-popup-msg{font-family:Georgia,serif;font-weight:800;font-size:clamp(24px,5vw,32px);letter-spacing:-.035em;line-height:1.22;color:var(--ink);margin:6px 0 20px}

/* public website only; creator/editor is separate */
.hide{display:none!important}@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes bob{50%{transform:translateY(-6px) rotate(4deg)}}@keyframes tap{35%{transform:rotate(2deg) translateY(-8px)}70%{transform:rotate(-4deg) translateY(4px)}}@keyframes paperIn{from{opacity:0;transform:rotate(-5deg) translateY(20px)}to{opacity:1;transform:rotate(0) translateY(0)}}@keyframes flicker{50%{scale:.84 1.06}}@keyframes smoke{0%{opacity:.9;transform:translateY(0)}100%{opacity:0;transform:translateY(-44px)}}@keyframes listen{50%{box-shadow:0 0 0 9px #edafd259}}@keyframes squish{to{transform:scale(1.05,.96) translateX(3px)}}@keyframes floatup{0%{opacity:0;transform:translateY(9px) scale(.7)}30%{opacity:1}100%{opacity:0;transform:translateY(-26px) scale(1.15)}}

/* Candle scene: front-facing cake at top, an actual wind source underneath */
.cake-scene{gap:0}.cake-stage{position:relative;width:min(500px,100%);min-height:350px;margin:4px auto 0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden;isolation:isolate;border-radius:24px;background:linear-gradient(180deg,#fffaf0 0%,#fff8ee 62%,#fae8f0 100%);border:2px solid #e8d6da}
.cake-stage .cake{margin:0 auto;z-index:2;flex:none;transform:scale(.94);transform-origin:top center}
.cake-stage .flame{transition:opacity .24s ease,scale .24s ease,filter .2s ease}.cake-stage.windy .flame:not(.gone){animation:flameWind .12s infinite alternate}.cake-stage .flame.gone{opacity:0;scale:.15}
.gust-lines{position:absolute;z-index:1;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.gust-lines path{fill:none;stroke:#9cd9d0;stroke-width:4.5;stroke-linecap:round;stroke-dasharray:11 12;opacity:0;transform:translateY(15px)}.cake-stage.gusting .gust-lines path{animation:gustRise .65s ease-out forwards}.cake-stage.gusting .gust-lines path:nth-child(2){animation-delay:.06s}.cake-stage.gusting .gust-lines path:nth-child(3){animation-delay:.12s}

.fan-unit{position:relative;z-index:5;align-self:center;margin-bottom:18px;display:grid;place-items:center;gap:6px}.fan-button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#d6f0df;border:3px solid var(--ink);border-radius:50%;width:108px;height:108px;box-shadow:5px 5px 0 var(--ink);touch-action:manipulation;user-select:none}.fan-button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}.fan-blades{font-size:50px;line-height:1;display:block;filter:drop-shadow(1px 1px 0 #50445d)}.cake-stage.windy .fan-blades{animation:fanSpin .34s linear infinite}.fan-button span:last-child{font-size:11px;font-weight:900;letter-spacing:.03em}.fan-aura{font-size:12px;font-weight:800;color:#785b85}
.air-bar{width:min(270px,78%);height:9px;border:1.5px solid #c7a9bb;border-radius:20px;background:#fff;overflow:hidden;margin:14px auto 8px}.air-fill{height:100%;width:0%;background:linear-gradient(90deg,#bce9da,#87d4e4);border-radius:inherit;transition:width .12s linear}.cake-clue{min-height:23px;margin:0 auto 7px;color:#5d456f}.cake-feedback{min-height:20px;margin:0 0 8px}.cake-scene #afterCake{padding:8px 0}
@keyframes gustRise{0%{opacity:0;transform:translateY(55px)}25%{opacity:.9}100%{opacity:0;transform:translateY(-85px)}}@keyframes fanSpin{to{transform:rotate(360deg)}}@keyframes flameWind{to{transform:rotate(-75deg) skewY(25deg) scale(.85,1.06);filter:brightness(1.05)}}

/* Floating decorations brought back: decorative only, gentle, behind content */
.flower{z-index:0;animation:decorFloat 4.8s ease-in-out infinite alternate;opacity:.65}.scene>:not(.flower){position:relative;z-index:1}

.hug-popup-dismiss.waiting{opacity:0;visibility:hidden;transform:translateY(16px);pointer-events:none}

.pattern-node.active::after{background:#fff;transform:scale(1.15)}
.pattern-node.active{background:#bd8bd1;box-shadow:0 0 0 6px #d5b7e255}

.present-glow{position:absolute;left:0;right:0;top:0;font-size:25px;color:#b58ad6;animation:decorFloat 2s ease-in-out infinite alternate}

.present-base::before{content:'';position:absolute;width:22%;height:100%;background:#ffed91;left:39%;top:0;border-left:3px solid var(--ink);border-right:3px solid var(--ink)}
.present-base::after{content:'';position:absolute;width:100%;height:23%;background:#ffed91;top:37%;left:0;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}

const $=s=>document.querySelector(s), stage=$('#stage');
const escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>escapeHTML(String(v??'').replaceAll('{name}',COPY.name).replaceAll('{sender}',COPY.sender));
const iconDecor=()=>'<span class="flower one" aria-hidden="true">✦</span><span class="flower two" aria-hidden="true">♡</span><span class="flower three" aria-hidden="true">✿</span><span class="flower four" aria-hidden="true">✳</span><span class="flower five" aria-hidden="true">✧</span><span class="flower six" aria-hidden="true">♡</span>';
let scene=0, envelopeTaps=0, noAttempts=0, noteIndex=-1, candles=0, micCleanup=null, hugSeen=false;
const touchMode=()=>matchMedia('(pointer:coarse)').matches || navigator.maxTouchPoints>0;
function show(n){closeHugPopup();if(micCleanup){micCleanup();micCleanup=null}scene=n;stage.scrollTop=0;render()}
function button(label,id,kind='pink'){return `<button class="btn ${kind}" type="button" id="${id}">${fmt(label)}</button>`}
function render(){
 switch(scene){
 case 0:stage.innerHTML=`<section class="scene">${iconDecor()}<div class="hero-emoji" aria-hidden="true">💌</div><p class="eyebrow">${fmt(COPY.intro.tag)}</p><h1>${fmt(COPY.intro.title)}</h1><p class="sub">${fmt(COPY.intro.subtitle)}</p>${button(COPY.intro.button,'go')}</section>`;$('#go').onclick=()=>show(1);break;
 case 1:stage.innerHTML=`<section class="scene">${iconDecor()}<p class="eyebrow">${fmt(COPY.apology.tag)}</p><h2>${fmt(COPY.apology.title)}</h2><article class="apology-note">${COPY.apology.paragraphs.map(x=>`<p>${fmt(x)}</p>`).join('')}</article>${button(COPY.apology.button,'go')}</section>`;$('#go').onclick=()=>show(2);break;
 case 2:stage.innerHTML=`<section class="scene">${iconDecor()}<p class="eyebrow">${fmt(COPY.envelope.tag)}</p><h2>${fmt(COPY.envelope.title)}</h2><p class="sub">${fmt(COPY.envelope.subtitle)}</p><button id="envelope" class="envelope-button" type="button" aria-label="Buka amplop"><span class="envelope-graphic"><span class="wax">♥</span></span></button><p class="tap-message" id="tap-msg" aria-live="polite"></p></section>`;envelopeTaps=0;$('#envelope').onclick=()=>{envelopeTaps++;const el=$('#envelope');el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');$('#tap-msg').textContent=COPY.envelope.hints[Math.min(envelopeTaps,COPY.envelope.hints.length-1)]||'';if(envelopeTaps>=3){el.disabled=true;$('#tap-msg').textContent=COPY.envelope.opening;setTimeout(()=>{if(scene===2)show(3)},470)}};break;
 case 3:stage.innerHTML=`<section class="scene">${iconDecor()}<p class="eyebrow">${fmt(COPY.question.tag)}</p><h2 class="question-title">${fmt(COPY.question.title)}</h2><p class="sub">${fmt(COPY.question.subtitle)}</p><div id="arena" class="arena"><button class="btn choice yes" id="yes">${fmt(COPY.question.yes)}</button><button class="btn choice no" id="no">${fmt(COPY.question.no)}</button></div><p id="tease" class="tease" aria-live="polite"></p></section>`;noAttempts=0;initRunaway();$('#yes').onclick=()=>show(4);break;

function initRunaway(){const arena=$('#arena'),no=$('#no'),yes=$('#yes'),tease=$('#tease');let last=0;function flee(px,py){if(scene!==3 || !no.isConnected)return;const now=performance.now();if(now-last<115)return;last=now;const a=arena.getBoundingClientRect(),y=yes.getBoundingClientRect(),bw=no.offsetWidth,bh=no.offsetHeight;let out=null;for(let i=0;i<45;i++){const x=8+Math.random()*Math.max(1,a.width-bw-20),ty=10+Math.random()*Math.max(1,a.height-bh-21);const candidate={left:a.left+x,right:a.left+x+bw,top:a.top+ty,bottom:a.top+ty+bh};const overlaps=!(candidate.right<y.left-12||candidate.left>y.right+12||candidate.bottom<y.top-9||candidate.top>y.bottom+9);const away=px==null||Math.hypot((candidate.left+candidate.right)/2-px,(candidate.top+candidate.bottom)/2-py)>105;if(!overlaps&&away){out={x,y:ty};break}}if(!out){out={x:Math.max(8,a.width-bw-14),y:14}}no.style.left=out.x+'px';no.style.top=out.y+'px';no.style.transform=`rotate(${(Math.random()*15-7).toFixed(1)}deg)`;noAttempts++;tease.textContent=COPY.question.teases[Math.min(COPY.question.teases.length-1,Math.max(0,Math.floor((noAttempts-1)/2)))]}
 arena.addEventListener('pointermove',e=>{if(e.pointerType==='touch'&&e.buttons===0)return;const r=no.getBoundingClientRect();const dx=Math.max(r.left-e.clientX,0,e.clientX-r.right),dy=Math.max(r.top-e.clientY,0,e.clientY-r.bottom);if(Math.hypot(dx,dy)<(e.pointerType==='touch'?12:70))flee(e.clientX,e.clientY)});

function initCake(){

 let power=0,streak=0,last=performance.now(),done=false,raf=0,activePointer=null,flamesOff=0;

  sweep.addEventListener('pointerdown',e=>{if(!isLive())return;e.preventDefault();activePointer=e.pointerId;y0=e.clientY;x0=e.clientX;sweep.classList.add('dragging');try{sweep.setPointerCapture(activePointer)}catch{}});

  const end=e=>{if(e.pointerId!==activePointer)return;const delta=y0-e.clientY,side=Math.abs(e.clientX-x0);sweep.classList.remove('dragging');sweep.querySelector('.hand').style.transform='';y0=null;x0=null;activePointer=null;if(delta>55&&delta>side*.7){gust(.23)}else if(isLive()){$('#cakeFeedback').textContent='usapnya dari bawah ke lilin ya';}};

  }

 };

/* AES-GCM keeps claim URL out of plain text; 5-digit pattern is a playful gate, not strong financial security. */
const enc=new TextEncoder(),dec=new TextDecoder();const b64=x=>btoa(String.fromCharCode(...new Uint8Array(x))),un64=x=>Uint8Array.from(atob(x),ch=>ch.charCodeAt(0));
async function keyFor(pattern,salt,mode){const raw=await crypto.subtle.importKey('raw',enc.encode(pattern),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:240000,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,[mode])}
async function lockGift(pattern,data){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const key=await keyFor(pattern,salt,'encrypt');const ciphertext=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(data)));return {salt:b64(salt),iv:b64(iv),data:b64(ciphertext)}}
async function openGift(pattern){if(!LOCKED_GIFT.data||!window.crypto?.subtle)throw Error('not-configured');const key=await keyFor(pattern,un64(LOCKED_GIFT.salt),'decrypt');const payload=await crypto.subtle.decrypt({name:'AES-GCM',iv:un64(LOCKED_GIFT.iv)},key,un64(LOCKED_GIFT.data));return JSON.parse(dec.decode(payload))}
function initPattern(){const board=$('#pattern'),nodes=[...board.querySelectorAll('.pattern-node')],line=$('#patternLine'),message=$('#patternMessage');let seq=[],pointer=null,dragging=false,reading=false,prev=null;const centers=()=>nodes.map(n=>{const r=n.getBoundingClientRect(),b=board.getBoundingClientRect();return {n,d:+n.dataset.number,x:(r.left+r.width/2-b.left)/b.width*300,y:(r.top+r.height/2-b.top)/b.height*300}});let positions=centers();function draw(){const pts=seq.map(k=>positions.find(v=>v.d===k)).filter(Boolean);line.setAttribute('points',pts.map(v=>v.x+','+v.y).join(' '))}function clear(){seq=[];nodes.forEach(n=>n.classList.remove('active','error'));line.setAttribute('points','')};function add(n){if(reading||!n||seq.includes(n))return;seq.push(n);nodes.find(v=>+v.dataset.number===n)?.classList.add('active');draw();if(seq.length>=5)submit()};function pick(clientX,clientY){const found=positions.find(p=>{const r=board.getBoundingClientRect(),x=(clientX-r.left)/r.width*300,y=(clientY-r.top)/r.height*300;return Math.hypot(x-p.x,y-p.y)<27});return found?.d};function testSegment(x1,y1,x2,y2){const r=board.getBoundingClientRect(),ax=(x1-r.left)/r.width*300,ay=(y1-r.top)/r.height*300,bx=(x2-r.left)/r.width*300,by=(y2-r.top)/r.height*300,dx=bx-ax,dy=by-ay,len=dx*dx+dy*dy;const candidates=positions.map(p=>{const t=len?Math.max(0,Math.min(1,((p.x-ax)*dx+(p.y-ay)*dy)/len)):0;return {d:p.d,t,dist:Math.hypot(p.x-(ax+t*dx),p.y-(ay+t*dy))}}).filter(p=>p.dist<20).sort((a,b)=>a.t-b.t);for(const p of candidates)add(p.d)}
 board.addEventListener('pointerdown',e=>{if(reading)return;const dot=e.target.closest('.pattern-node');if(!dot)return;e.preventDefault();pointer=e.pointerId;dragging=true;prev=[e.clientX,e.clientY];try{board.setPointerCapture(pointer)}catch{}add(+dot.dataset.number)});board.addEventListener('pointermove',e=>{if(!dragging||pointer!==e.pointerId||reading)return;testSegment(prev[0],prev[1],e.clientX,e.clientY);prev=[e.clientX,e.clientY]});const end=e=>{if(pointer===e.pointerId){dragging=false;pointer=null;prev=null}};board.addEventListener('pointerup',end);board.addEventListener('pointercancel',end);nodes.forEach(n=>n.addEventListener('click',e=>{if(e.detail===0)add(+n.dataset.number)}));window.addEventListener('resize',()=>{if(scene===7){positions=centers();draw()}},{passive:true});
 async function submit(){if(reading)return;reading=true;message.textContent='sebentar... ♡';try{
 const gift=await openGift(seq.join(''));if(scene!==7)return;const url=String(gift.url||'').trim();const valid=/^https:\/\//i.test(url)&&new URL(url).hostname!=='';
 stage.innerHTML=`<section class="scene unlock-success">${iconDecor()}<p class="eyebrow">${fmt(COPY.claim.ready)}</p><h2 class="gift-title">${fmt('Buat kamu, Pru ♡')}</h2><p class="sub">Coba dibuka.</p><button type="button" id="openGift" class="present-button" aria-label="Buka kado"><span class="present-glow" aria-hidden="true">✦ ♡ ✧</span><span class="present-lid"></span><span class="present-base"><span></span></span><span class="present-note">tap kadonya 🎀</span></button><div id="giftReveal" class="gift-reveal hide"><div class="bouquet" role="img" aria-label="Buket bunga warna pink, krem, dan ungu"><span class="bouquet-spark">✦</span><span class="bouquet-flower a">🌷</span><span class="bouquet-flower b">🌼</span><span class="bouquet-flower c">🌷</span><span class="bouquet-flower d">🌸</span><span class="bouquet-flower e">🌼</span><div class="bouquet-wrap">♡</div></div><h3>${fmt(gift.title||'Buat kamu ♡')}</h3><p class="gift-note">${fmt(gift.note||'ini buat kamu, ya ♡')}</p>${gift.noteImage?`<div class="photo-note"><p class="photo-note-label">ini aku tulis sendiri</p><img src="${escapeHTML(gift.noteImage)}" alt="Foto catatan tulisan tangan yang aku buat khusus untuk kamu" draggable="false" loading="eager"></div>`:''}${gift.amount?`<p class="claim-amount">${fmt(gift.amount)}</p>`:''}${valid?`<a class="btn pink claim-button" href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer">${fmt(COPY.claim.button)}</a>`:''}<p class="small end-line">${fmt(COPY.claim.endLine)}</p><button class="restart-icon" id="restart" type="button" aria-label="Lihat lagi dari awal" title="Lihat dari awal"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11a9 9 0 1 1 2.4 6.1"/><path d="M3 4v7h7"/></svg></button></div></section>`;

 }catch(err){message.textContent=err?.message==='not-configured'?'hadiahnya belum disiapkan ♡':COPY.claim.wrong;nodes.forEach(n=>n.classList.add('error'));setTimeout(()=>{if(scene===7&&board.isConnected){clear();reading=false}},700);return}reading=false}

}
